<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kartenvorschau · GeoGuessr</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Nunito', system-ui, sans-serif; background: #120d36; color: #fff; }
    header { padding: 14px 20px 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 900; font-style: italic; }
    header p { margin: 0; color: #b7b0e6; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 10px 10px; height: calc(100vh - 64px); grid-auto-rows: 1fr; }
    .cell { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,255,255,.15); }
    .map { position: absolute; inset: 0; }
    .label {
      position: absolute; top: 8px; left: 8px; z-index: 5; background: rgba(20,14,64,.9); border-radius: 10px;
      padding: 6px 10px; font-weight: 900; font-size: .95rem; pointer-events: none; box-shadow: 0 3px 10px rgba(0,0,0,.35);
    }
    .label small { display: block; font-weight: 700; color: #b7b0e6; font-size: .75rem; }
    .num { color: #fecd19; margin-right: 4px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr 1fr; height: auto; grid-auto-rows: 320px; } }
  </style>
</head>
<body>
  <header>
    <h1>Kartenvorschau</h1>
    <p>Alle Karten bewegen sich gemeinsam – einfach in einer Karte ziehen oder zoomen und vergleichen.</p>
  </header>
  <div class="grid" id="grid"></div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script>
    const OSM_DE = {
      version: 8,
      sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.de/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 18,
        attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>' } },
      layers: [{ id: 'osm', type: 'raster', source: 'osm' }],
    };
    const OPTIONS = [
      { name: 'Aktuell: OpenStreetMap (DE)', note: 'Pixel-Kacheln, deutsche Namen', style: OSM_DE },
      { name: 'Google-Look', note: 'VersaTiles „googol“ · deutsche Namen', style: 'karten/googol.json' },
      { name: 'Bunt', note: 'VersaTiles „colorful“ · deutsche Namen', style: 'karten/colorful.json' },
      { name: 'Natur', note: 'VersaTiles „natural“ · deutsche Namen', style: 'karten/natural.json' },
      { name: 'Hell & schlicht', note: 'VersaTiles „positrino“ · deutsche Namen', style: 'karten/positrino.json' },
      { name: 'Liberty', note: 'OpenFreeMap · deutsche Namen', style: 'https://tiles.openfreemap.org/styles/liberty', ofm: true },
      { name: 'Bright', note: 'OpenFreeMap · deutsche Namen', style: 'https://tiles.openfreemap.org/styles/bright', ofm: true },
      { name: 'Satellit', note: 'VersaTiles · Luftbild mit Beschriftung', style: 'karten/satellite.json' },
      { name: 'Dunkel', note: 'VersaTiles „colorful-dark“ · passt zum Spiel-Design', style: 'karten/colorful-dark.json' },
    ];

    // OpenFreeMap: Beschriftungen auf Deutsch (Fallback: Ortsname)
    function germanLabels(map) {
      for (const layer of map.getStyle().layers) {
        if (layer.type !== 'symbol') continue;
        const tf = map.getLayoutProperty(layer.id, 'text-field');
        if (!tf || !JSON.stringify(tf).includes('name')) continue;
        map.setLayoutProperty(layer.id, 'text-field', ['coalesce', ['get', 'name:de'], ['get', 'name_de'], ['get', 'name']]);
      }
    }

    const grid = document.getElementById('grid');
    const maps = [];
    let syncing = false;
    let activeMap = null;
    OPTIONS.forEach((o, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = `<div class="label"><span class="num">${i + 1}</span>${o.name}<small>${o.note}</small></div><div class="map"></div>`;
      grid.appendChild(cell);
      const map = new maplibregl.Map({
        container: cell.querySelector('.map'),
        style: o.style,
        center: [10.5, 50.5],
        zoom: 3.6,
        attributionControl: { compact: true },
        dragRotate: false,
        pitchWithRotate: false,
      });
      map.touchZoomRotate.disableRotation();
      if (o.ofm) map.once('styledata', () => setTimeout(() => germanLabels(map), 50));
      const container = cell.querySelector('.map');
      ['pointerdown', 'wheel', 'touchstart'].forEach(t => container.addEventListener(t, () => { activeMap = map; }, { capture: true, passive: true }));
      map.on('move', () => {
        if (syncing || activeMap !== map) return;
        syncing = true;
        const view = { center: map.getCenter(), zoom: map.getZoom() };
        for (const m of maps) if (m !== map) m.jumpTo(view);
        syncing = false;
      });
      maps.push(map);
    });
  </script>
</body>
</html>
